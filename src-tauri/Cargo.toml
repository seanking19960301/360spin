[package]
name = "spin360"
version = "0.1.0"
description = "Local AI product spin video generator"
authors = ["360spin contributors"]
edition = "2021"

[lib]
name = "spin360_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
